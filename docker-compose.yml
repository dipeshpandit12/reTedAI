name: retedai

x-service-defaults: &service-defaults
  restart: unless-stopped

services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_DNS_ORDER: A,CNAME,LAST
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8080:8000"
      - "127.0.0.1:8006:8001"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      web:
        condition: service_healthy
      case:
        condition: service_healthy
      ai:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      automation:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    <<: *service-defaults
    build: ./web
    ports:
      - "3000:3000"
    environment:
      CASE_SERVICE_URL: http://case:8001
      AI_SERVICE_URL: http://ai:8002
      KNOWLEDGE_SERVICE_URL: http://knowledge:8003
      AUTOMATION_SERVICE_URL: http://automation:8004
      AUTH_SERVICE_URL: http://auth:8005
    depends_on:
      case:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth:
    <<: *service-defaults
    build: ./services/auth
    ports:
      - "8005:8005"
    environment:
      AUTH_MODE: ${AUTH_MODE:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-retedai}:${POSTGRES_PASSWORD:-retedai}@db:5432/${POSTGRES_DB:-retedai}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-retedai}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-retedai-web}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  case:
    <<: *service-defaults
    build: ./services/case
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retedai}:${POSTGRES_PASSWORD:-retedai}@db:5432/${POSTGRES_DB:-retedai}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai:
    <<: *service-defaults
    build: ./services/ai
    ports:
      - "8002:8002"
    environment:
      KNOWLEDGE_SERVICE_URL: http://knowledge:8003
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  knowledge:
    <<: *service-defaults
    build: ./services/knowledge
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retedai}:${POSTGRES_PASSWORD:-retedai}@db:5432/${POSTGRES_DB:-retedai}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  automation:
    <<: *service-defaults
    build: ./services/automation
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retedai}:${POSTGRES_PASSWORD:-retedai}@db:5432/${POSTGRES_DB:-retedai}
      ENABLE_AUTOMATION_EXECUTION: ${ENABLE_AUTOMATION_EXECUTION:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retedai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retedai}
      POSTGRES_DB: ${POSTGRES_DB:-retedai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retedai} -d ${POSTGRES_DB:-retedai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
