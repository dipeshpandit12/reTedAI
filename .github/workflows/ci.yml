name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, case, ai, knowledge, automation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker compose build
      - name: Test service images
        run: |
          docker compose run --rm --no-deps auth python -m pytest -q
          docker compose run --rm --no-deps case python -m pytest -q
          docker compose run --rm --no-deps ai python -m pytest -q
          docker compose run --rm --no-deps knowledge python -m pytest -q
          docker compose run --rm --no-deps automation python -m pytest -q
      - name: Start and wait for the stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Load demo data
        run: python db/seed/load_seed.py
      - name: Verify browser-to-service flow
        run: python scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
